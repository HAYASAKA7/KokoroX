[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoroarc"
dynamic = ["version"]
description = "A multilingual character-persona runtime for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HAYASAKA7" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "build>=1,<2",
  "pytest-cov>=5,<7",
  "pytest-xdist>=3,<4",
]

[project.urls]
Homepage = "https://github.com/HAYASAKA7/KokoroX"
Repository = "https://github.com/HAYASAKA7/KokoroX"
Issues = "https://github.com/HAYASAKA7/KokoroX/issues"

[project.scripts]
kokorox = "kokoroarc.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kokoroarc.__version__"}

[tool.setuptools.package-data]
kokoroarc = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/kokoroarc/schemas/v1" = ["schemas/v1/*.schema.json"]
"share/kokoroarc/skills/using-kokorox" = [
  "skills/using-kokorox/SKILL.md",
]
"share/kokoroarc/skills/using-kokorox/agents" = [
  "skills/using-kokorox/agents/*.yaml",
]
"share/kokoroarc/skills/using-kokorox/references" = [
  "skills/using-kokorox/references/*.md",
]
"share/kokoroarc/skills/authoring-character-packs" = [
  "skills/authoring-character-packs/SKILL.md",
]
"share/kokoroarc/skills/authoring-character-packs/agents" = [
  "skills/authoring-character-packs/agents/*.yaml",
]
"share/kokoroarc/skills/authoring-character-packs/references" = [
  "skills/authoring-character-packs/references/*.md",
]
"share/kokoroarc/skills/researching-characters" = [
  "skills/researching-characters/SKILL.md",
]
"share/kokoroarc/skills/researching-characters/agents" = [
  "skills/researching-characters/agents/*.yaml",
]
"share/kokoroarc/skills/researching-characters/references" = [
  "skills/researching-characters/references/*.md",
]
"share/kokoroarc/skills/testing-character-packs" = [
  "skills/testing-character-packs/SKILL.md",
]
"share/kokoroarc/skills/testing-character-packs/agents" = [
  "skills/testing-character-packs/agents/*.yaml",
]
"share/kokoroarc/skills/testing-character-packs/references" = [
  "skills/testing-character-packs/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
# Measure the repository tree only. A bare package name also matches the
# copies integration tests install into temp roots, which would silently
# inflate the denominator and understate coverage.
source = ["src/kokoroarc"]
# Statement coverage only: tests spawn subprocesses whose coverage data is
# written without this config, and branch data cannot combine with statement
# data ("Can't combine statement coverage data with branch data").
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 80
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '\.\.\.',
]
