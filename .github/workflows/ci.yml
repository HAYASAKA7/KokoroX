name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run a reduced matrix for speed; main and tags run the full
  # cross-platform matrix, which is what substantiates the cross-OS claim.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      python: ${{ steps.pick.outputs.python }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python=["3.11","3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'python=["3.11","3.12","3.13","3.14"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
        python: ${{ fromJSON(needs.matrix.outputs.python) }}
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # tests/skills holds the frozen Campaign 6 machinery and historical
      # campaign evidence. Some of it binds skill bytes captured before the
      # KokoroX rename, so it is deliberately out of the CI gate rather than
      # silently marked passing. See docs/ for the campaign scope note.
      - name: Test
        shell: bash
        run: |
          set +e
          out=$(python -m pytest tests/unit tests/integration tests/security -n auto --dist load -q --tb=line -rf --durations=15 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            # Job logs need admin rights; annotations are public, so surface
            # the failing test names there.
            summary=$(echo "$out" | grep -E '^(FAILED|ERROR)' | head -20 | paste -sd';' -)
            echo "::error title=pytest ${{ matrix.os }} py${{ matrix.python }}::${summary:-see log}"
          fi
          exit "$rc"

  coverage:
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # fail_under = 80 is configured in pyproject.toml
      - name: Coverage gate
        run: >
          python -m pytest tests/unit tests/integration tests/security
          -n auto --dist load -q --cov --cov-report=term-missing:skip-covered

  # The product's headline feature is installing Skills into a host's Skill
  # root. Verify that from a real built wheel on every platform.
  install-smoke:
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.os) }}
    steps:
      - name: Allow long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install the wheel
        shell: bash
        run: python -m pip install "$(ls dist/*.whl | head -1)"

      - name: Install the Skill suite and verify placement
        shell: bash
        run: |
          set +e
          kokorox --version
          out=$(kokorox suite install --skills-root "$PWD/ci-skills" --json 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=suite install ${{ matrix.os }}::rc=$rc $(echo "$out" | tr -s '[:space:]' ' ' | cut -c1-400)"
            exit "$rc"
          fi
          skills=$(find ci-skills -name SKILL.md | wc -l | tr -d ' ')
          agents=$(find ci-skills -path '*/agents/*.yaml' | wc -l | tr -d ' ')
          if [ "$skills" -ne 4 ] || [ "$agents" -ne 40 ]; then
            echo "::error title=install layout ${{ matrix.os }}::SKILL.md=$skills want 4, agents=$agents want 40"
            exit 1
          fi
          echo "4 skills and 40 agent profiles installed"
